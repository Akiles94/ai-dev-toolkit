name: Release

# Publishes to npm when a GitHub release is published. Uses npm trusted publishing (OIDC): no token
# is stored in the repository, and every version carries provenance pointing to this workflow run.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # No registry-url: it writes an .npmrc with a placeholder token that shadows the OIDC
          # exchange of trusted publishing. npm already defaults to registry.npmjs.org.
      - run: npm ci --no-audit --no-fund
      - name: Release tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skip if this version is already on npm (e.g. the first version, published by hand)
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      # `verify` tests the QA walker in a real browser, as CI does: without it, coverage falls under
      # its minimum. Installed globally, for the tests only; the package does not depend on it.
      - name: Playwright and Chromium for the browser tests
        if: steps.published.outputs.skip != 'true'
        run: npm install -g playwright@1.63.0 && playwright install --with-deps chromium
      # prepublishOnly runs `verify` and `build` first.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
